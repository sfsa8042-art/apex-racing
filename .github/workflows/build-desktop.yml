on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows .exe / .msi
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. Node.js ──────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      # ── 3. Rust ─────────────────────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets:   x86_64-pc-windows-msvc

      # ── 4. Cargo cache ───────────────────────────────────────────────────────
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      # ── 5. Install desktop npm deps ─────────────────────────────────────────
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      # ── 6. Build ─────────────────────────────────────────────────────────────
      - name: Build Tauri app
        working-directory: desktop
        env:
          CI: true
          TAURI_ENV_PLATFORM: windows
          TAURI_ENV_ARCH:     x86_64
          TAURI_ENV_FAMILY:   windows
          TAURI_ENV_DEBUG:    "false"
        run: npm run tauri:build -- --target x86_64-pc-windows-msvc

      # ── 7. List built files ──────────────────────────────────────────────────
      - name: List bundle output
        shell: pwsh
        run: |
          $dir = "desktop\src-tauri\target\x86_64-pc-windows-msvc\release\bundle"
          if (Test-Path $dir) {
            Get-ChildItem -Recurse $dir -Include "*.exe","*.msi" |
              ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Host "Bundle directory not found: $dir"
          }

      # ── 8. Upload artifacts ──────────────────────────────────────────────────
      - name: Upload NSIS .exe
        uses: actions/upload-artifact@v4
        with:
          name:              apex-desktop-windows-exe
          path:              desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days:    30

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name:              apex-desktop-windows-msi
          path:              desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days:    30

      # ── 9. Locate installer files ────────────────────────────────────────────
      - name: Find installer files
        id: find
        shell: pwsh
        run: |
          $base = "desktop\src-tauri\target\x86_64-pc-windows-msvc\release\bundle"
          $exe  = Get-ChildItem -Recurse "$base\nsis\*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $msi  = Get-ChildItem -Recurse "$base\msi\*.msi"  -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) { echo "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT }
          if ($msi) { echo "msi_path=$($msi.FullName)" >> $env:GITHUB_OUTPUT }
          echo "has_exe=$([bool]$exe)"  >> $env:GITHUB_OUTPUT
          echo "has_msi=$([bool]$msi)"  >> $env:GITHUB_OUTPUT

      # ── 10. Determine release tag ────────────────────────────────────────────
      - name: Determine release info
        id: release
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            echo "tag=${{ github.ref_name }}"          >> $env:GITHUB_OUTPUT
            echo "prerelease=false"                    >> $env:GITHUB_OUTPUT
            echo "name=APEX Desktop ${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "tag=latest-build"                    >> $env:GITHUB_OUTPUT
            echo "prerelease=true"                     >> $env:GITHUB_OUTPUT
            echo "name=Latest Build (auto)"            >> $env:GITHUB_OUTPUT
          }

      # ── 11. Delete existing pre-release ──────────────────────────────────────
      - name: Delete existing latest pre-release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          try {
            gh release delete latest-build --yes --repo ${{ github.repository }}
          } catch { Write-Host "No existing release to delete" }
          try {
            git push origin :refs/tags/latest-build
          } catch { Write-Host "No existing tag to delete" }

      # ── 12. Create GitHub Release ────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:               ${{ steps.release.outputs.tag }}
          name:                   ${{ steps.release.outputs.name }}
          prerelease:             ${{ steps.release.outputs.prerelease }}
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/') }}
          body: |
            ## APEX Desktop — Windows Installer

            ### Установка
            1. Скачай `.exe` файл ниже
            2. Запусти установщик
            3. Открой APEX Desktop → вставь API-токен из профиля на сайте
            4. Выбери папку телеметрии → нажми Старт

            Built from: `${{ github.sha }}`
          files: |
            ${{ steps.find.outputs.exe_path }}
            ${{ steps.find.outputs.msi_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
