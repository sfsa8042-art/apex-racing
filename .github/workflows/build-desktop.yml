on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Build
        working-directory: desktop
        env:
          CI: true
          TAURI_ENV_PLATFORM: windows
          TAURI_ENV_ARCH: x86_64
          TAURI_ENV_FAMILY: windows
          TAURI_ENV_DEBUG: "false"
        run: npm run tauri:build -- --target x86_64-pc-windows-msvc

      - name: Find installer
        id: find
        shell: pwsh
        run: |
          $base = "desktop\src-tauri\target\x86_64-pc-windows-msvc\release\bundle"
          $exe = Get-ChildItem -Recurse "$base\nsis\*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) { echo "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT }

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest Build
          prerelease: true
          overwrite: true
          files: ${{ steps.find.outputs.exe_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
